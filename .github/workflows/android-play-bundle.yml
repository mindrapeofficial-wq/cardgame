name: Build ARCANUM Google Play bundle

on:
  workflow_dispatch:
  push:
    branches: [codex/arcanum-play-publication]
    paths:
      - 'android/**'
      - '.github/workflows/android-play-bundle.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-play-bundle.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Community and purchase security tests
        run: node --test --experimental-strip-types tests/*.test.mjs

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Firebase config (google-services.json from secret)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf "%s" "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; echo "Firebase config written"; else echo "No GOOGLE_SERVICES_JSON secret: building without Firebase"; fi

      - name: Build release bundle and run Android lint
        working-directory: android
        run: gradle :app:bundleRelease :app:lintRelease --stacktrace

      # Play upload key: kept only as GitHub secrets (never in the repository). Without them the
      # bundle stays unsigned and the signing steps are skipped.
      - name: Sign release bundle with the upload key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then echo "No upload key secrets: bundle left unsigned"; exit 0; fi
          printf "%s" "$KEYSTORE_B64" | tr -d '
 ' | base64 -d > "$RUNNER_TEMP/upload.jks"
          cp android/app/build/outputs/bundle/release/app-release.aab ARCANUM-TCG-1.2.8.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/upload.jks" -storepass:env KEYSTORE_PASSWORD ARCANUM-TCG-1.2.8.aab "$KEY_ALIAS"
          jarsigner -verify ARCANUM-TCG-1.2.8.aab | tail -1
          rm -f "$RUNNER_TEMP/upload.jks"
          echo "signed=1" >> "$GITHUB_OUTPUT"

      - name: Upload signed bundle (for Google Play)
        if: steps.sign.outputs.signed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: ARCANUM-TCG-1.2.8-play-signed
          path: ARCANUM-TCG-1.2.8.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: ARCANUM-TCG-1.2.8-unsigned-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARCANUM-TCG-1.2.8-lint
          path: android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 30

