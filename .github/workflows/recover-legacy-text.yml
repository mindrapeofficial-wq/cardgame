name: Recover Legacy Assets

# Manual only: the original client lives in the "legacy-archive" release, not in the repo.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download original client from the legacy-archive release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download legacy-archive --pattern Rolplay.zip --dir .tmp-download

      - name: Extract legacy configuration and images
        run: |
          set -euo pipefail
          # Only replace the extracted folders; legacy-assets/image-index.json is used by the game.
          rm -rf .tmp-rolplay legacy-config legacy-assets/imagenes
          mkdir -p .tmp-rolplay legacy-config legacy-assets/imagenes
          unzip -q .tmp-download/Rolplay.zip -d .tmp-rolplay

          cp .tmp-rolplay/Rolplay/version_data_host_chr.txt legacy-config/
          cp .tmp-rolplay/Rolplay/version_data_hostnochar.txt legacy-config/
          cp .tmp-rolplay/Rolplay/winsock_host.dat legacy-config/
          cp .tmp-rolplay/Rolplay/Principal.log legacy-config/
          cp .tmp-rolplay/Rolplay/Intercambio.log legacy-config/
          cp .tmp-rolplay/Rolplay/version_leeme.txt legacy-config/

          cp -a .tmp-rolplay/Rolplay/imagenes/. legacy-assets/imagenes/

          echo "Recovered image count:"
          find legacy-assets/imagenes -type f | wc -l

      - name: Commit recovered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy-config legacy-assets/imagenes
          git commit -m "Recover original Rolplay image assets" || exit 0
          git push
