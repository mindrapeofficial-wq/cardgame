name: Analyze Legacy Client

# Manual only: the analysis only changes when the archived client does, so it no longer
# runs (and commits) on every push to main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download original client from the legacy-archive release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download legacy-archive --pattern Rolplay.zip --dir .tmp-download

      - name: Inspect Rolplay.zip
        run: |
          set -euo pipefail
          rm -rf .legacy-analysis
          mkdir -p .legacy-analysis/extracted
          unzip -q .tmp-download/Rolplay.zip -d .legacy-analysis/extracted
          {
            echo "ROLPLAY LEGACY CLIENT ANALYSIS"
            echo
            echo "== ZIP SUMMARY =="
            unzip -l .tmp-download/Rolplay.zip
            echo
            echo "== EXTRACTED FILE TREE =="
            find .legacy-analysis/extracted -type f -printf '%P\t%s bytes\n' | sort
            echo
            echo "== FILE TYPES =="
            while IFS= read -r -d '' f; do
              printf '%s\t' "${f#.legacy-analysis/extracted/}"
              file -b "$f"
            done < <(find .legacy-analysis/extracted -type f -print0 | sort -z)
          } > LEGACY_ANALYSIS.md

      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LEGACY_ANALYSIS.md
          git commit -m "Analyze original Rolplay legacy client" || exit 0
          git push
