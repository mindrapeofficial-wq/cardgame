name: Build ARCANUM TCG APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Android 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'

      - name: Firebase config (google-services.json from secret)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf "%s" "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; echo "Firebase config written"; else echo "No GOOGLE_SERVICES_JSON secret: building without Firebase"; fi

      - name: Build installable APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ARCANUM-TCG-1.2.8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARCANUM-TCG-1.2.8
          path: ARCANUM-TCG-1.2.8.apk
          if-no-files-found: error
          retention-days: 30

