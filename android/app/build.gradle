plugins {
    id 'com.android.application'
}

// Firebase: google-services.json is not committed (the repository is public). Locally it sits in
// android/app/; the GitHub build writes it from the GOOGLE_SERVICES_JSON secret. Without the file
// the app still builds, just without Firebase.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
}

android {
    namespace 'com.arcanum.classic'
    compileSdk 36

    defaultConfig {
        applicationId 'com.arcanum.classic'
        minSdk 26
        targetSdk 36
        versionCode 13
        versionName '1.2.8'
    }

    buildTypes {
        debug {
            debuggable false
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

