plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arcanum.classic'
    compileSdk 35

    defaultConfig {
        applicationId 'com.arcanum.classic'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.2.3'
    }

    buildTypes {
        debug {
            debuggable false
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
