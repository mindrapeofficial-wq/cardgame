plugins {
    id 'com.android.application'
}

// Firebase: google-services.json is not committed (the repository is public). Locally it sits in
// android/app/; the GitHub build writes it from the GOOGLE_SERVICES_JSON secret. Without the file
// the app still builds, just without Firebase.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-installations'
}

def firebaseFile = rootProject.file('firebase-config.json')
def firebaseConfig = firebaseFile.exists() ? new groovy.json.JsonSlurper().parse(firebaseFile) : [:]
if (firebaseConfig.isEmpty() && file('google-services.json').exists()) {
    def services = new groovy.json.JsonSlurper().parse(file('google-services.json'))
    def client = services.client.find { it.client_info.android_client_info.package_name == 'com.arcanum.classic' }
    if (client != null) firebaseConfig = [APP_ID:client.client_info.mobilesdk_app_id,
        API_KEY:client.api_key[0].current_key, PROJECT_ID:services.project_info.project_id,
        SENDER_ID:services.project_info.project_number]
}

android {
    namespace 'com.arcanum.classic'
    compileSdk 36
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.arcanum.classic'
        minSdk 26
        targetSdk 36
        versionCode 13
        versionName '1.2.8'
        ['APP_ID','API_KEY','PROJECT_ID','SENDER_ID'].each { field ->
            buildConfigField 'String', 'FIREBASE_' + field, groovy.json.JsonOutput.toJson(firebaseConfig[field] ?: '')
        }
    }

    buildTypes {
        debug {
            debuggable false
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

