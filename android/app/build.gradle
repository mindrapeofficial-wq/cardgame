plugins {
    id 'com.android.application'
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
}

def firebaseFile = rootProject.file('firebase-config.json')
def firebaseConfig = firebaseFile.exists() ? new groovy.json.JsonSlurper().parse(firebaseFile) : [:]

android {
    namespace 'com.arcanum.classic'
    compileSdk 36
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.arcanum.classic'
        minSdk 26
        targetSdk 36
        versionCode 13
        versionName '1.2.8'
        ['APP_ID','API_KEY','PROJECT_ID','SENDER_ID'].each { field ->
            buildConfigField 'String', 'FIREBASE_' + field, groovy.json.JsonOutput.toJson(firebaseConfig[field] ?: '')
        }
    }

    buildTypes {
        debug {
            debuggable false
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

